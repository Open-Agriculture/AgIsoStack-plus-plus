; AgIsoStack++ on the Arduino framework, one sketch (src/main.cpp) for several boards.
; Build one board with `pio run -e teensy41`, or every board with `pio run`.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = teensy41, teensy40, esp32

[env]
framework = arduino
lib_deps = https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git
monitor_speed = 115200

[env:teensy41]
platform = teensy@6.0.0
board = teensy41

[env:teensy40]
platform = teensy@6.0.0
board = teensy40

[env:esp32]
platform = espressif32@6.10.0
board = denky32
monitor_filters = esp32_exception_decoder

; Mainly for CI reasons: the same boards, built against a locally installed AgIsoStack
[env:local_teensy41]
extends = env:teensy41
lib_deps = AgIsoStack-plus-plus

[env:local_teensy40]
extends = env:teensy40
lib_deps = AgIsoStack-plus-plus

[env:local_esp32]
extends = env:esp32
lib_deps = AgIsoStack-plus-plus
