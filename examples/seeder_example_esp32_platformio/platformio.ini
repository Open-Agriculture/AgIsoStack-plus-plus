; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
; Don't build the CI environment by default, to avoid unnecessary build
; errors for beginners who select the default environment.
default_envs = esp32-s3-devkitc-1

; This example is an ESP32 port of the desktop examples/seeder_example. It is
; a Virtual Terminal + Task Controller client with section control, so it is
; larger than the minimal VT object pool example and needs a bigger app
; partition (see board_build.partitions below).
;
; The default board targets an ESP32-S3 (e.g. the Waveshare
; ESP32-S3-ETH-8DI-8RO-C used by the AgIsoRelayBlock project). If you use a
; different board, change `board` here and the pin map (CAN, digital inputs and
; relay I2C) in src/board_config.hpp.
[env:esp32-s3-devkitc-1]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf

lib_deps = https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git

; Embeds the object pool into the firmware image (there is no filesystem to
; read BasePool.iop from at runtime), exposing the _binary_BasePool_iop_start /
; _end symbols used in src/vt_application.cpp. This MUST be embed_files (raw
; binary), NOT embed_txtfiles: embed_txtfiles appends a NUL terminator, which
; makes the uploaded pool one byte longer than the real .iop. The VT then parses
; that trailing 0x00 as a truncated Working Set object and rejects the pool with
; a "file system error or corruption", so the object pool never loads.
board_build.embed_files = src/object_pool/BasePool.iop
; Full VT + TC + diagnostics firmware overflows the default 1 MB factory app
; partition. The custom partitions.csv (in this directory) gives a single
; large factory app slot, and avoids relying on PlatformIO resolving a
; built-in table. board_upload.flash_size matches the 16 MB Waveshare N16R8.
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

build_type = debug
build_flags = -Wno-error=missing-field-initializers
upload_protocol = esptool
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

; Mainly for CI reasons, we introduce a new environment for cases
; where AgIsoStack is installed locally
[env:local_agisostack]
extends = env:esp32-s3-devkitc-1
lib_deps = AgIsoStack-plus-plus
