name: Mull - Thread Synchronization

on:
  workflow_dispatch:

  push:
    branches:
      - quality/mull-mutation-testing-poc
    paths:
      - .github/workflows/mull-thread-synchronization.yml

permissions:
  contents: read

jobs:
  thread-synchronization:
    name: Mutation testing - thread_synchronization
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 19 and build dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang-19 \
            llvm-19 \
            build-essential \
            cmake \
            ninja-build \
            curl

      - name: Install Mull for LLVM 19
        shell: bash
        run: |
          curl -1sLf \
            'https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh' \
            | sudo -E bash

          sudo apt-get update
          sudo apt-get install -y mull-19

      - name: Verify tool versions
        shell: bash
        run: |
          echo "=== Clang ==="
          clang-19 --version

          echo
          echo "=== LLVM ==="
          llvm-config-19 --version

          echo
          echo "=== Mull ==="
          mull-runner-19 --version

          echo
          echo "=== Mull compiler plugin ==="
          test -f /usr/lib/mull-ir-frontend-19
          ls -l /usr/lib/mull-ir-frontend-19

      - name: Create reduced Mull configuration
        shell: bash
        run: |
          cat > mull-thread-synchronization.yml <<'EOF'
          includePaths:
            - ".*utility/include/isobus/utility/thread_synchronization\\.hpp$"

          excludePaths:
            - ".*googletest.*"
            - ".*googlemock.*"
            - ".*gtest.*"
            - ".*gmock.*"

          quiet: false
          EOF

          echo "=== Mull configuration ==="
          cat mull-thread-synchronization.yml

      - name: Configure tests for Mull
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull-thread-synchronization.yml
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fpass-plugin=/usr/lib/mull-ir-frontend-19"

      - name: Compile GoogleTest executable
        shell: bash
        run: |
          cmake --build build --parallel

      - name: Verify GoogleTest executable
        shell: bash
        run: |
          test -x build/test/unit_tests

          echo "=== GoogleTest executable ==="
          file build/test/unit_tests

      - name: Run thread synchronization test without mutation
        shell: bash
        run: |
          echo "=== Baseline test ==="

          build/test/unit_tests \
            --gtest_filter='*CreateAndDestroyPartners*' \
            --gtest_fail_if_no_test_selected

      - name: Run Mull on thread_synchronization
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-thread-synchronization.yml
        run: |
          mkdir -p mull-results

          set -o pipefail

          mull-runner-19 \
            --allow-surviving \
            --include-not-covered \
            --minimum-timeout 10000 \
            --reporters IDE \
            --reporters Elements \
            --report-dir mull-results \
            --report-name thread-synchronization \
            build/test/unit_tests \
            --gtest_filter='*CreateAndDestroyPartners*' \
            --gtest_fail_if_no_test_selected \
            2>&1 | tee mull-results/mull-console.log

      - name: Display generated reports
        if: always()
        shell: bash
        run: |
          echo "=== Generated Mull reports ==="
          find mull-results -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload Mull results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-thread-synchronization-results
          path: |
            mull-results/
            mull-thread-synchronization.yml
          if-no-files-found: warn
          retention-days: 30
     
