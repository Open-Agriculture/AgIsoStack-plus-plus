name: Mull - Processing Flags - All Tests

on:
  workflow_dispatch:

  # Le workflow n'étant pas encore présent sur main, ce déclencheur permet
  # de l'exécuter lorsque son propre fichier est créé ou modifié.
  push:
    branches:
      - quality/mull-processing-flags
    paths:
      - .github/workflows/mull-processing-flags.yml

permissions:
  contents: read

jobs:
  processing-flags:
    name: Mutation testing - processing_flags - all tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 19 and build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang-19 \
            llvm-19 \
            build-essential \
            cmake \
            ninja-build \
            curl

      - name: Install Mull for LLVM 19
        shell: bash
        run: |
          set -euo pipefail

          curl -1sLf \
            "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
            | sudo -E bash

          sudo apt-get update
          sudo apt-get install -y mull-19

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail

          clang-19 --version
          llvm-profdata-19 --version
          llvm-cov-19 --version
          mull-runner-19 --version

          test -f /usr/lib/mull-ir-frontend-19

      - name: Create Mull configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > mull-processing-flags.yml <<'EOF'
          includePaths:
            - ".*utility/src/processing_flags\\.cpp$"
          excludePaths:
            - ".*googletest.*"
            - ".*googlemock.*"
            - ".*gtest.*"
            - ".*gmock.*"
          quiet: false
          EOF

          echo "=== Mull configuration ==="
          cat mull-processing-flags.yml

      - name: Configure tests for Mull and LLVM coverage
        shell: bash
        env:
          CC: clang-19
          CXX: clang++-19
          MULL_CONFIG: ${{ github.workspace }}/mull-processing-flags.yml
        run: |
          set -euo pipefail

          cmake -S . -B build \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fprofile-instr-generate -fcoverage-mapping -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Compile unit tests
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build --parallel
          test -x build/test/unit_tests

      - name: Run all unit tests and generate coverage
        shell: bash
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/all-tests.profraw
        run: |
          set -euo pipefail

          rm -f all-tests.profraw all-tests.profdata

          cd build/test

          ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/all-tests-baseline.log"

          cd "${GITHUB_WORKSPACE}"

          test -s all-tests.profraw

          llvm-profdata-19 merge \
            -sparse \
            all-tests.profraw \
            -o all-tests.profdata

          test -s all-tests.profdata

      - name: Generate readable coverage report
        shell: bash
        run: |
          set -euo pipefail

          llvm-cov-19 show \
            build/test/unit_tests \
            -instr-profile=all-tests.profdata \
            utility/src/processing_flags.cpp \
            | tee processing-flags-coverage.txt

      - name: Run Mull with all unit tests
        shell: bash
        env:
          MULL_CONFIG: ${{ github.workspace }}/mull-processing-flags.yml
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/mull-results"

          cd build/test

          mull-runner-19 \
            --allow-surviving \
            --debug \
            --timeout 120000 \
            --coverage-info "${GITHUB_WORKSPACE}/all-tests.profdata" \
            --reporters IDE \
            --reporters Elements \
            --report-dir "${GITHUB_WORKSPACE}/mull-results" \
            --report-name processing-flags-all-tests \
            ./unit_tests \
            --gtest_color=no \
            2>&1 | tee "${GITHUB_WORKSPACE}/mull-results/mull-console.log"

      - name: Display Mull results
        if: always()
        shell: bash
        run: |
          echo "=== Generated Mull files ==="
          find mull-results -maxdepth 2 -type f -print 2>/dev/null || true

          echo
          echo "=== Mull console output ==="
          cat mull-results/mull-console.log 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-processing-flags-all-unit-tests
          path: |
            mull-results/
            mull-processing-flags.yml
            all-tests-baseline.log
            all-tests.profdata
            processing-flags-coverage.txt
          if-no-files-found: warn
          retention-days: 30
